<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>logica</title>
</head>
<body>
    <h1>Aprovação de Empréstimo Bancário</h1>
     <script src="logica.js"></script>

     <div class="container"> 
        <h2> Análise de Empréstimo</h2>
     </div>

     <div class="form-group"> 
        <label for="idade">Idade:</label>
        <input type="number" id="idade" min="0" placeholder="Ex: 22">
     </div> 

     <div class="form-group"> 
        <label for="idade">Renda Mensal (R$):</label>
        <input type="number" id="renda" min="0" step="0.01" required min="0" placeholder="Ex: 3500.00">
     </div>

      <div class="form-group"> 
        <label for="idade">Score de Crédito (R$):</label>
        <input type="number" id="score" required min="0"  max="1000" placeholder="Ex:850">
     </div>
     
     <div class="checkbox-group"> 
        <input type="checkbox" id="restricao">
        <label for="restricao"> Possui restricao no nome (CPF negativo)</label>
     </div>

     <button type="button" onclick="analisarEmprestion()"> Verificar Situação</button>
    </form>

    <div id="resultado" class="result"></div>

</body>
</html>
